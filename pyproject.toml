[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rshl-kernel"
version = "1.0.0"
description = "Rivers State-Hamiltonian Learning Framework with Topological Evolution, Recursive Adaptation, and Manifold Integration"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "BSD-2-Clause"}
authors = [
    {name = "Synthicsoft Labs", email = "contact@synthicsoft.com"}
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["rshl_kernel*"]
